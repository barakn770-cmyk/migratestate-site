name: Daily Content Pipeline

# Runs every day at 05:30 UTC = 08:30 Israel (summer) / 07:30 (winter).
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: claude-sonnet-4-6
      SITE_HOST: migratestate.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests pillow

      - name: Daily fact-check (5-page rotation, official sources only)
        continue-on-error: true
        run: python3 scripts/fact_check.py

      - name: Generate today's article from queue
        continue-on-error: true
        run: python3 scripts/content_engine.py

      - name: SEO health auto-repair + sitemap rebuild
        run: python3 scripts/seo_health.py --fix || true

      - name: Commit and push straight to main (fully automatic — no PR gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name  "MigrateState Content Engine"
          git config user.email "content-engine@migratestate.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes today."; exit 0
          fi
          git add -A
          git commit -m "MigrateState Content Engine — $(date -u +%F)"
          git push origin HEAD:main

      # continue-on-error above means a broken fact-check or article step does
      # NOT fail this job by itself (one script's outage shouldn't block the
      # other, and shouldn't block pushing whatever partial work did succeed).
      # This step is the safety net: it checks whether each step actually
      # produced real output today, and — with no continue-on-error — fails
      # the JOB (triggering GitHub's automatic "workflow run failed" email to
      # the repo owner) if something silently broke. This is the only signal
      # you get without watching the Actions tab yourself, so don't remove it.
      - name: Verify the run actually produced output (fails loudly on silent breakage)
        run: |
          TODAY=$(date -u +%F)
          FAIL=""
          if ! grep -q "\"$TODAY\"" factcheck_state.json 2>/dev/null; then
            FAIL="fact-check produced nothing today (all 5 API calls likely errored — see the 'Daily fact-check' step log above for the real Python traceback)"
          fi
          if ! grep -q "^### New article" .pipeline_summary.md 2>/dev/null; then
            FAIL="${FAIL:+$FAIL; }content-engine produced no article and no 'queue empty' notice (it likely crashed — see the 'Generate today's article' step log above for the real Python traceback)"
          fi
          if [ -n "$FAIL" ]; then
            echo "::error::$FAIL"
            exit 1
          fi
          echo "Verified: both fact-check and the article step produced real output today."
